<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join the Queue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <div class="container">
        <h2>Join the Queue</h2>

        <!-- Form to enter name and email -->
        <form id="joinQueueForm">
            <input type="text" id="name" placeholder="Enter your name" required>
            <input type="email" id="email" placeholder="Enter your email" required>
            <button type="submit">Join Queue</button>
        </form>

        <!-- This will display the current queue position after joining -->
        <div id="queueStatus"></div>

        <!-- This section will show the user's queue position and the leave button after joining -->
        <div id="userPositionSection" style="display: none;">
            <h3>Your Position</h3>
            <div class="queue-circle" id="userQueuePosition"></div>
            <button id="leaveQueueBtn">Leave Queue</button>
        </div>
    </div>

    <script>
        // Handle form submission for joining the queue
        document.getElementById('joinQueueForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;

            fetch('/join_queue', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ name: name, email: email })
            })
            .then(response => response.json())
            .then(data => {
                if (data.message) {
                    document.getElementById('queueStatus').textContent = data.message;

                    // Hide the form after joining
                    document.getElementById('joinQueueForm').style.display = 'none';

                    // Show the user's position and leave button
                    document.getElementById('userPositionSection').style.display = 'block';
                    document.getElementById('userQueuePosition').textContent = data.user.position;

                    // Store the user's ID to use for the leave functionality
                    document.getElementById('leaveQueueBtn').setAttribute('data-user-id', data.user.id);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });

        // Handle the leave button click
        document.getElementById('leaveQueueBtn').addEventListener('click', function() {
            const userId = this.getAttribute('data-user-id');

            fetch(`/leave_queue/${userId}`, {
                method: 'POST',
            })
            .then(response => response.json())
            .then(data => {
                alert(data.message);

                // Hide the queue position section and show the form again
                document.getElementById('userPositionSection').style.display = 'none';
                document.getElementById('joinQueueForm').style.display = 'block';

                // Reset the form
                document.getElementById('name').value = '';
                document.getElementById('email').value = '';
                document.getElementById('queueStatus').textContent = '';
            })
            .catch(error => {
                console.error('Error:', error);
            });
        });
    </script>
</body>
</html>
