<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Queue Controls</title>
    <link rel="stylesheet" href="../../public/css/styles.css">
</head>
<body>
    <div class="container">
        <h1>Queue Management</h1>
        <a href="/views/admin/dashboard.html">
            <button class="btn">Back to Dashboard</button>
        </a>

        <section>
            <h2>Create a New Queue</h2>
            <form id="createQueueForm">
                <input type="text" id="queueName" placeholder="Enter Queue Name" required>
                <button type="submit" class="btn">Create Queue</button>
            </form>
        </section>

        <section>
            <h2>Active Queues</h2>
            <p class="loading">Loading queues...</p>
            <div id="queueList"></div>
        </section>
    </div>

    <script type="module">
        import { db, auth } from "../../public/js/firebase-config.js";
        import { collection, addDoc, deleteDoc, updateDoc, onSnapshot, doc, getDoc, query, where } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-firestore.js";
        import { onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

        const queueCollection = collection(db, "queues");
        const queueList = document.getElementById("queueList");
        const loadingIndicator = document.querySelector(".loading");

        // ✅ Restrict Access to Logged-in Admins
        onAuthStateChanged(auth, (user) => {
            if (!user) {
                window.location.href = "/auth.html"; // Redirect if not logged in
            } else {
                loadQueues(user.uid);
            }
        });

        // ✅ Optimized Firestore Read: Load Queues only for this admin
        function loadQueues(adminId) {
            loadingIndicator.style.display = "block";
            const q = query(queueCollection, where("adminId", "==", adminId));
            onSnapshot(q, (snapshot) => {
                queueList.innerHTML = "";
                loadingIndicator.style.display = "none";

                if (snapshot.empty) {
                    queueList.innerHTML = "<p>No queues found. Create one above.</p>";
                    return;
                }

                snapshot.forEach((docSnap) => {
                    const queue = docSnap.data();
                    // Updated to only count users with position > 0
                    const activeUsersCount = queue.users ? queue.users.filter(u => u.position > 0).length : 0;
                    queueList.innerHTML += `
                        <div class="queue-card">
                            <h3>${queue.name}</h3>
                            <p>Status: <span>${queue.status}</span></p>
                            <p>Users: ${activeUsersCount}</p>
                            <button class="btn" onclick="toggleQueueStatus('${docSnap.id}', '${queue.status}')">
                                ${queue.status === 'active' ? 'Pause' : 'Resume'}
                            </button>
                            <!-- Added Next button under the Pause button -->
                            <button class="btn" onclick="nextQueue('${docSnap.id}')">Next</button>
                            <button class="btn delete-btn" onclick="deleteQueue('${docSnap.id}')">Delete</button>
                            <button class="btn" onclick="generateQR('${docSnap.id}')">Generate QR Code</button>
                            <div id="qrcode-${docSnap.id}"></div>
                        </div>
                    `;
                });
            }, (error) => {
                console.error("Error loading queues:", error);
                queueList.innerHTML = `<p style="color:red;">Error loading queues. Check console.</p>`;
            });
        }

        // ✅ Create Queue and Generate QR Code
        document.getElementById("createQueueForm").addEventListener("submit", async (e) => {
            e.preventDefault();
            const queueName = document.getElementById("queueName").value.trim();

            if (!queueName) {
                alert("Queue name cannot be empty.");
                return;
            }

            try {
                // When creating queue, we add the current admin's UID as adminId
                const user = auth.currentUser;
                if (!user) {
                    alert("User not authenticated!");
                    return;
                }
                const newQueue = {
                    name: queueName,
                    adminId: user.uid, // Associate queue with current admin
                    status: "active",
                    users: [],
                    currentPosition: 1,
                    estimatedWaitTime: 0,
                    waitTimes: [],
                    createdAt: new Date()
                };
                const queueDocRef = await addDoc(queueCollection, newQueue);
                generateQR(queueDocRef.id);
                document.getElementById("queueName").value = "";
            } catch (error) {
                console.error("Error creating queue:", error);
                alert("Failed to create queue. Check console.");
            }
        });

        // ✅ Toggle Queue Status (Pause/Resume)
        window.toggleQueueStatus = async (queueId, currentStatus) => {
            try {
                const queueDoc = doc(db, "queues", queueId);
                await updateDoc(queueDoc, { status: currentStatus === "active" ? "paused" : "active" });
            } catch (error) {
                console.error("Error updating queue status:", error);
                alert("Failed to update queue status.");
            }
        };

        // ✅ Next Button: Shift queue positions and alert when a user reaches position zero
        window.nextQueue = async (queueId) => {
            try {
                const queueDoc = doc(db, "queues", queueId);
                const queueSnap = await getDoc(queueDoc);
                if (!queueSnap.exists()) return;
                let users = queueSnap.data().users || [];
                // Shift positions: subtract 1 from each user's position
                let updatedUsers = users.map(user => {
                    let newPos = user.position - 1;
                    return { ...user, position: newPos < 0 ? 0 : newPos };
                });
                await updateDoc(queueDoc, { users: updatedUsers });
            } catch (error) {
                console.error("Error updating next queue:", error);
            }
        };

        // ✅ Secure Queue Deletion with Confirmation
        window.deleteQueue = async (queueId) => {
            if (!confirm("Are you sure you want to delete this queue? This action cannot be undone.")) return;

            try {
                const queueDoc = doc(db, "queues", queueId);
                await deleteDoc(queueDoc);
            } catch (error) {
                console.error("Error deleting queue:", error);
                alert("Failed to delete queue.");
            }
        };

        // ✅ Generate QR Code
        window.generateQR = (queueId) => {
            // Change the QR code text to direct users to the join-queue page
            const qrText = `${window.location.origin}/views/user/join-queue.html?queueId=${queueId}`;
            const qrDiv = document.getElementById(`qrcode-${queueId}`);
            qrDiv.innerHTML = "";

            new QRCode(qrDiv, {
                text: qrText,
                width: 150,
                height: 150
            });
        };
    </script>

    <!-- ✅ QR Code Library -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs/qrcode.min.js"></script>
</body>
</html>
