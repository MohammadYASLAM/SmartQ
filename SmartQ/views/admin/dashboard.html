<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="../../public/css/styles.css">
    
</head>
<body>
    <div class="container">
        <h1>Admin Dashboard</h1>
        <p id="admin-name">Loading...</p>
        <p class="loading">Fetching data...</p>
        <button class="btn" id="manageQueues">Manage Queues</button>
        <button class="btn" id="logout-btn">Logout</button>
    </div>

    <script type="module">
        import { auth } from "../../public/js/firebase-config.js";
        import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.11.1/firebase-auth.js";

        // ✅ Restrict access to only logged-in admins
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("admin-name").innerText = `Welcome, ${user.email}`;
                document.querySelector(".loading").style.display = "none";
            } else {
                window.location.href = "/auth.html"; // Redirect if not logged in
            }
        });

        // ✅ Logout functionality
        document.getElementById("logout-btn").addEventListener("click", () => {
            signOut(auth).then(() => {
                window.location.href = "/auth.html";
            });
        });

        // ✅ Redirect to Queue Management
        document.getElementById("manageQueues").addEventListener("click", () => {
            window.location.href = "/views/admin/queue-controls.html";
        });
    </script>
</body>
</html>
