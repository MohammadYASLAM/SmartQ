<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Queue Position</title>
    <link rel="stylesheet" href="public/css/styles.css">
</head>
<body>
    <div class="queue-status">
        <h2>Queue Status</h2>
        <p id="user-position">Your position: --</p>
        <p id="estimated-wait-time">Estimated wait time: -- minutes</p>
    </div>

    <div id="qrcode"></div>

    <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
    <script src="public/js/user.js"></script>
    <script>
        // Assuming the `queueId` is passed as a URL parameter
        const urlParams = new URLSearchParams(window.location.search);
        const queueId = urlParams.get('queueId');
        
        if (queueId) {
            listenForQueueUpdates(queueId);
            generateQR(queueId);
        }
    </script>
</body>
</html>
