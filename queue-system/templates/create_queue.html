<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Queue</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Create a New Queue</h1>
        <form method="POST">
            <label for="queue_name">Queue Name:</label>
            <input type="text" id="queue_name" name="queue_name" required>
            <button type="submit">Create Queue</button>
        </form>

        {% if qr_code %}
            <div>
                <h2>QR Code for Your Queue</h2>
                <img src="data:image/png;base64,{{ qr_code | b64encode }}" alt="QR Code">
            </div>
        {% endif %}
    </div>
</body>
</html>
